name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/cicd_pipe:${{ github.sha }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/cicd_pipe:${{ github.sha }}

      - name: Tag and Push Latest
        run: |
          docker tag ${{ secrets.DOCKER_USERNAME }}/cicd_pipe:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/cicd_pipe:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/cicd_pipe:latest
